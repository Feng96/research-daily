<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoD2 实验 · 实景与模型</title><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../vendor/maplibre-gl.css"><link rel="stylesheet" href="./style.css"></head><body>
<header class="header"><div class="brand"><div><h1 id="chapter-name">实景与屋面</h1><p id="chapter-detail">Georgetown · NAIP + 3DEP</p></div></div><div class="header-actions"><button id="export" disabled>保存对照图 ↓</button></div></header>
<section class="toolbar" aria-label="对照设置">
<div class="building-controls"><label for="cohort">样本</label><select id="cohort"><option value="all">全部建筑</option><option value="legacy60">原 60 栋</option><option value="fresh60">新增 60 栋</option></select><button id="previous" aria-label="上一栋">←</button><select id="building" aria-label="选择建筑" disabled><option>正在加载…</option></select><button id="next" aria-label="下一栋">→</button><button id="focus">定位</button></div>
<div class="method-controls"><label for="group-select">方法</label><select id="group-select" disabled></select></div>
<div class="source-controls"><label for="basemap">底图</label><select id="basemap"><option value="satellite">卫星／航片 · Esri</option><option value="naip">NAIP 2014 · 实验输入</option><option value="osm">OpenStreetMap</option></select></div>
</section>
<main class="workspace">
<section class="pane image-pane" aria-label="真实影像地图"><div id="image-map" class="map"></div><div class="pane-title"><span class="dot"></span><div><strong id="image-title">真实卫星／航空影像</strong><small>实景 · 点击轮廓选择建筑</small></div></div><div class="image-tools"><label><input type="checkbox" id="footprint" checked>足迹轮廓</label><button id="clean-image">查看纯影像</button></div><div class="map-note" id="imagery-note">Esri 影像时相未逐栋核实，可能与2014年观测不同。</div></section>
<section class="pane model-pane" aria-label="三维重建地图"><div id="model-map" class="map"></div><div class="pane-title"><span class="dot model-dot"></span><div><strong id="model-title">屋面模型</strong><small>右键旋转 · 滚轮缩放 · 左键平移</small></div></div><div class="model-tools"><div class="view-buttons"><button id="view-3d" class="active" aria-pressed="true">三维</button><button id="view-top" aria-pressed="false">俯视</button></div><label><input type="checkbox" id="roof-only">仅屋面</label><label><input type="checkbox" id="models" checked>模型</label><label><input type="checkbox" id="edges" checked>边线</label><label><input type="checkbox" id="baseline-overlay">基线轮廓</label><label class="opacity-label" for="opacity">透明度<input type="range" id="opacity" min="15" max="100" value="100"><output id="opacity-value">100%</output></label></div><div id="geometry-warning" class="geometry-warning" role="status" hidden></div><div class="map-note">高度比例 1× · 同栋跨实验共用显示基准 · 未加载真实地形。青色线为基线。</div></section>
<div id="loading" role="status"><span class="spinner"></span><strong id="loading-text">正在载入建筑模型…</strong></div>
</main>
<section class="inspector" aria-label="所选建筑信息"><div class="selection"><span class="eyebrow">当前建筑</span><strong id="selected-id">—</strong><span id="selected-height">—</span><label class="metric-mode" for="metric-mode">比较指标<select id="metric-mode"><option value="common">全组同点 MAE</option><option value="paired">相对基线的同点 MAE 变化</option></select></label><p class="metric-note" id="metric-note">误差与覆盖率一起阅读；同次点云留出检验。</p></div><div class="metrics" id="metrics" aria-live="polite"></div></section>
<div id="toast" role="status" hidden></div><script src="../vendor/maplibre-gl.js"></script><script type="module" src="./app.js"></script></body></html>
